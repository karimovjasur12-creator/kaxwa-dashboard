<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: header + tabs (bottom bar on phones); overview = profit hero, yesterday strip, KPI tiles, donuts and bars; production = interval pills, hero with sparkline, cumulative comparison, stacked days, shops, items, documents. */
:root {
  --plane: #0a0e13; --surface: #121921; --surface2: #18212b; --ink: #eef3f7; --ink2: #aab7c3; --muted: #7a8996;
  --grid: #222c37; --axis: #324050; --ring: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.07); --cost: #56606b;
  --s1: #3987e5; --s2: #d95926; --s3: #34d399; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9;
  --w1: #184f95; --w2: #3987e5; --w3: #86b6ef;
  --good: #34d399; --crit: #fb7185; --warn: #fbbf24; --accent: #34d399; --on-accent: #04140d; --link: #7dd3fc;
  --kA: #f5b84a; --kB: #f0634d; --kC: #38bdf8;
  --glow1: rgba(52,211,153,0.16); --glow2: rgba(99,102,241,0.16); --glow3: rgba(56,189,248,0.12); --shadow: rgba(0,0,0,0.55);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --plane: #eef3f2; --surface: #ffffff; --surface2: #f8fbfa; --ink: #0d1613; --ink2: #4a5a55; --muted: #6b7a75;
  --grid: #dfe8e5; --axis: #c3d0cb; --ring: rgba(13,22,19,0.10); --hover: rgba(13,22,19,0.05); --cost: #c3d0cb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --w1: #86b6ef; --w2: #2a78d6; --w3: #104281;
  --good: #0a7a4a; --crit: #c9302c; --warn: #b7791f; --accent: #0b7a58; --on-accent: #ffffff; --link: #0b6fa8;
  --kA: #b9791e; --kB: #c0352b; --kC: #1f78b4;
  --glow1: rgba(11,122,88,0.10); --glow2: rgba(99,102,241,0.08); --glow3: rgba(56,189,248,0.10); --shadow: rgba(13,22,19,0.18); color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: radial-gradient(900px 520px at 12% -8%, var(--glow1), transparent 62%), radial-gradient(760px 460px at 100% 0%, var(--glow2), transparent 60%), radial-gradient(820px 560px at 45% 108%, var(--glow3), transparent 66%), var(--plane);
  background-attachment: fixed; color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--ink2); margin: 2px 0 0; }
.badge { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink2); border: 1px solid var(--axis); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.badge.warn { border-color: var(--warn); }
.tabs { display: flex; gap: 4px; background: var(--grid); padding: 4px; border-radius: 14px; align-self: flex-start; }
.tab { border: 0; background: transparent; padding: 9px 20px; border-radius: 10px; cursor: pointer; font-weight: 650; color: var(--ink2); transition: background .2s, color .2s; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }
section.page { display: flex; flex-direction: column; gap: 14px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.pill { border: 1px solid var(--axis); background: var(--surface); border-radius: 999px; padding: 8px 16px; font-weight: 600; color: var(--ink2); cursor: pointer; transition: background .2s, color .2s, transform .15s; }
.pill:active { transform: scale(0.96); }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dates { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink2); }
.dates input { border: 1px solid var(--axis); background: var(--surface); border-radius: 8px; padding: 5px 8px; }
.cmp { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); margin-left: 4px; cursor: pointer; }
.spacer { flex: 1; }
.btn { border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
.btn:disabled { opacity: 0.55; cursor: default; }
.status { color: var(--ink2); font-size: 13px; min-height: 18px; margin: 0; }
.status.err { color: var(--crit); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.card { background: color-mix(in srgb, var(--surface2) 72%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--ring); border-radius: 22px; padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 18px 36px -24px var(--shadow); }
.kpi { gap: 4px; }
.kpi .label { font-size: 13px; color: var(--ink2); }
.kpi .value { font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .note { font-size: 12px; color: var(--ink2); overflow-wrap: anywhere; }
.hero { gap: 12px; }
.hero .label { font-size: 14px; color: var(--ink2); }
.hero .value { font-variant-numeric: tabular-nums; font-size: clamp(38px, 9vw, 60px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; overflow-wrap: anywhere; }
.hero .dline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--ink2); }
.dl { font-size: 13px; font-weight: 650; white-space: nowrap; }
.dl.up { color: var(--good); }
.dl.down { color: var(--crit); }
.dl.flat { color: var(--ink2); font-weight: 500; }
.eq { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.term { border: 1px solid var(--ring); border-radius: 12px; padding: 9px 13px; background: rgba(127,127,127,0.07); min-width: 0; }
.term small { display: block; color: var(--ink2); font-size: 12px; }
.term b { font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
.op { color: var(--muted); font-size: 20px; line-height: 1; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
.card h2 { font-size: 15px; font-weight: 650; margin: 0; }
.cap { color: var(--ink2); font-size: 13px; margin: 0; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.lg { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); font-size: 13px; }
.lg-sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.chart { width: 100%; min-width: 0; }
.chart svg { display: block; }
.tk { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.hit { fill: transparent; cursor: crosshair; }
.hb-list { display: flex; flex-direction: column; gap: 4px; }
.hb { display: block; width: calc(100% + 16px); margin: 0 -8px; padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; }
button.hb { cursor: pointer; }
button.hb:hover, .hb.sel { background: var(--hover); }
.hb-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.hb-name { overflow-wrap: anywhere; }
.hb-sub { display: block; color: var(--ink2); font-size: 12px; }
.hb-val { font-weight: 650; white-space: nowrap; text-align: right; }
.hb-d { display: block; font-size: 12px; font-weight: 650; }
.hb-d.up { color: var(--good); }
.hb-d.down { color: var(--crit); }
.hb-d.flat { color: var(--ink2); font-weight: 500; }
.hb-track { display: block; height: 12px; background: var(--hover); border-radius: 0 4px 4px 0; }
.hb-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; transform-origin: left; animation: growx .9s cubic-bezier(.2,.7,.2,1) both; }
.bb { display: flex; flex-direction: column; gap: 14px; }
.bb-row { display: flex; flex-direction: column; gap: 6px; }
.bb-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.bb-name { font-weight: 650; }
.bb-meta { color: var(--ink2); font-size: 13px; }
.bb-track { display: flex; height: 20px; min-width: 2px; cursor: default; transform-origin: left; animation: growx .9s cubic-bezier(.2,.7,.2,1) both; }
.bb-cost { background: var(--cost); }
.bb-inc { margin-left: 2px; border-radius: 0 4px 4px 0; }
.seg { display: flex; gap: 2px; height: 28px; }
.seg > div { transform-origin: left; animation: growx .9s cubic-bezier(.2,.7,.2,1) both; border-radius: 4px; display: flex; align-items: center; padding-left: 8px; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; min-width: 0; cursor: default; }
.insight { color: var(--ink2); margin: 0; }
.link { border: 0; background: transparent; color: var(--link); font-weight: 600; cursor: pointer; padding: 0; text-align: left; }
.search { width: 100%; max-width: 340px; padding: 10px 12px; border: 1px solid var(--axis); border-radius: 10px; background: var(--plane); }
.tv summary { cursor: pointer; color: var(--ink2); font-size: 13px; font-weight: 600; }
.tw { overflow-x: auto; margin-top: 8px; border: 1px solid var(--ring); border-radius: 8px; }
.tw table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tw th, .tw td { padding: 6px 10px; border-bottom: 1px solid var(--grid); text-align: left; white-space: nowrap; }
.tw th { color: var(--ink2); font-weight: 600; }
.tw td.n, .tw th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tw td.wrap { white-space: normal; min-width: 180px; }
.st { display: inline-flex; align-items: center; gap: 6px; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; }
.note { color: var(--ink2); font-size: 12px; margin: 0; }
.empty { color: var(--ink2); padding: 8px 0; }
#tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface2); color: var(--ink); border: 1px solid var(--axis); border-radius: 10px; padding: 9px 11px; box-shadow: 0 10px 28px rgba(0,0,0,0.35); min-width: 150px; max-width: 280px; }
.tt-title { font-size: 12px; color: var(--ink2); margin-bottom: 4px; }
.tt-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.tt-key { width: 10px; height: 2px; border-radius: 1px; background: var(--ink2); flex: none; }
.tt-name { color: var(--ink2); flex: 1; }
.tt-val { font-weight: 700; white-space: nowrap; }

/* premium layer */
header { align-items: center; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { width: 46px; height: 46px; border-radius: 14px; flex: none; display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; color: var(--on-accent); background: linear-gradient(135deg, var(--accent), #c8782a); box-shadow: 0 8px 20px -8px var(--accent); }
.hright { display: flex; align-items: center; gap: 10px; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink2); font-size: 18px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.badge { display: inline-flex; align-items: center; gap: 7px; }
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); animation: pulse 2.4s ease-in-out infinite; }
.badge.warn::before { background: var(--warn); animation: none; }
.hero { position: relative; overflow: hidden; border-color: color-mix(in srgb, var(--accent) 28%, var(--ring)); }
.hero::before { content: ""; position: absolute; width: 460px; height: 460px; right: -140px; top: -220px; background: radial-gradient(circle, var(--glow1), transparent 66%); pointer-events: none; }
.hero > * { position: relative; }
.hero-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 28px; }
.hero-l { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero-r { display: flex; flex-direction: column; gap: 4px; width: min(100%, 320px); }
.spark { width: 100%; height: 64px; }
.spark svg { display: block; }
.kpi { position: relative; padding-top: 22px; }
.kpi::before { content: ""; position: absolute; left: 18px; top: 0; width: 34px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.tile { text-align: left; border: 1px solid var(--ring); border-radius: 14px; padding: 14px; background: rgba(127,127,127,0.06); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
button.tile { cursor: pointer; transition: transform .15s, background .2s; }
button.tile:hover { background: var(--hover); transform: translateY(-2px); }
.tile .tl { font-size: 12px; color: var(--ink2); letter-spacing: 0.02em; }
.tile .tv2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .td { font-size: 12px; font-weight: 650; color: var(--ink2); }
.td.up { color: var(--good); } .td.down { color: var(--crit); } .td.cost, .dl.cost { color: var(--ink2); }
.split { display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: 18px 28px; align-items: center; }
.dnwrap { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.dn svg { display: block; animation: spin-in 1s cubic-bezier(.2,.7,.2,1) both; }
.dnwrap .legend { justify-content: center; }
.dn-c1 { fill: var(--ink); font-weight: 700; font-size: 22px; font-family: var(--font); }
.dn-c2 { fill: var(--ink2); font-size: 12px; font-family: var(--font); }
.seg-ring { cursor: default; transition: opacity .15s; }
.line-main { fill: none; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
@keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes growx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growy { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes spin-in { from { opacity: 0; transform: rotate(-70deg) scale(0.88); } to { opacity: 1; transform: none; } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent); } 50% { box-shadow: 0 0 0 5px transparent; } }
@keyframes draw { from { stroke-dashoffset: var(--len, 1200); } to { stroke-dashoffset: 0; } }
section.page > * { animation: up .55s cubic-bezier(.2,.7,.2,1) both; }
section.page > *:nth-child(2) { animation-delay: .05s; } section.page > *:nth-child(3) { animation-delay: .1s; } section.page > *:nth-child(4) { animation-delay: .15s; }
section.page > *:nth-child(5) { animation-delay: .2s; } section.page > *:nth-child(6) { animation-delay: .25s; } section.page > *:nth-child(7) { animation-delay: .3s; }
.chart svg path.col { transform-box: fill-box; transform-origin: 50% 100%; animation: growy .8s cubic-bezier(.2,.7,.2,1) both; }
.chart svg .ln { stroke-dasharray: var(--len, 1200); animation: draw 1.1s cubic-bezier(.2,.7,.2,1) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 720px) {
  .split { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr; }
  h1 { font-size: 20px; }
  body { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .tabs { position: fixed; z-index: 40; left: max(14px, env(safe-area-inset-left, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); align-self: auto;
    background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--axis); box-shadow: 0 14px 30px -10px var(--shadow); padding: 5px; }
  .tab { flex: 1; padding: 13px 8px; font-size: 15px; }
  .pill { padding: 10px 16px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
  .filters > * { flex: none; }
  .card { padding: 16px; border-radius: 20px; }
}

.lf { display: inline; } .ls { display: none; }
.h3 { font-size: 14px; font-weight: 650; margin: 4px 0 0; color: var(--ink2); }
.mpills { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.mpill { border: 1px solid var(--axis); background: transparent; color: var(--ink2); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px; cursor: pointer; }
.mpill[aria-pressed="true"] { background: var(--ink); color: var(--plane); border-color: var(--ink); }
.tile.warn { border-color: color-mix(in srgb, var(--crit) 45%, var(--ring)); }
.rsum { display: flex; flex-wrap: wrap; gap: 8px; }
.rbadge { font-size: 13px; font-weight: 650; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--ring); }
.rbadge.ok { color: var(--good); } .rbadge.bad { color: var(--crit); }
.recon table { table-layout: fixed; min-width: 640px; }
.recon th:nth-child(1) { width: 34px; } .recon th:nth-child(2) { width: 21%; } .recon th:nth-child(3), .recon th:nth-child(4) { width: 18%; }
.recon .tw td { white-space: normal; overflow-wrap: anywhere; }
.recon .tw td.wrap { min-width: 0; line-height: 1.4; color: var(--ink2); }
.recon .tw td, .recon .tw th { vertical-align: top; padding-block: 9px; }
.rs { font-weight: 800; font-size: 15px; width: 28px; }
.rs.ok { color: var(--good); } .rs.bad { color: var(--crit); } .rs.na { color: var(--muted); }
.acc { display: flex; flex-direction: column; }
.acc-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
.acc-row:last-child { border-bottom: 0; }
.acc-l { display: flex; flex-direction: column; min-width: 0; }
.acc-n { overflow-wrap: anywhere; }
.acc-s { font-size: 12px; color: var(--ink2); }
.acc-v { font-weight: 700; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.acc-row.neg .acc-v { color: var(--crit); }
.acc-w { display: block; font-size: 12px; font-weight: 650; color: var(--crit); }
.warnline { margin: 0; font-size: 13px; color: var(--ink2); border-left: 3px solid var(--crit); padding: 6px 10px; background: color-mix(in srgb, var(--crit) 8%, transparent); border-radius: 0 8px 8px 0; }
@media (max-width: 720px) {
  .recon .tw { overflow: visible; }
  .recon table, .recon tbody, .recon tr, .recon td { display: block; width: auto; }
  .recon thead { display: none; }
  .recon tr { display: grid; grid-template-columns: 22px 1fr; gap: 3px 8px; padding: 10px 12px; border-bottom: 1px solid var(--grid); }
  .recon .tw td { border: 0; padding: 0; white-space: normal; text-align: left !important; justify-self: start; grid-column: 2; }
  .recon .tw td.rs { grid-column: 1; grid-row: 1 / span 4; }
  .recon .tw td:nth-child(2) { font-weight: 650; }
  .recon .tw td.n::before { content: attr(data-l) " "; color: var(--muted); font-size: 12px; }
  .recon .tw td.wrap { min-width: 0; max-width: none; }
  .lf { display: none; } .ls { display: inline; }
  .tabs { gap: 2px; }
  .tab { padding: 12px 2px; font-size: 13px; }
}
/* ---------- landscape: left sidebar, wider grid (phone on its side, tablet, desktop, office TV) ---------- */
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { display: grid; grid-template-columns: 188px minmax(0, 1fr); column-gap: 20px; row-gap: 14px; max-width: 1480px; align-items: start; }
  .wrap > * { grid-column: 2; min-width: 0; }
  .wrap > header { grid-column: 1 / -1; }
  .wrap > .tabs { grid-column: 1; grid-row: 2 / span 12; position: sticky; top: calc(14px + env(safe-area-inset-top, 0px)); left: auto; right: auto; bottom: auto;
    flex-direction: column; align-self: start; gap: 4px; padding: 6px; border-radius: 16px; background: var(--grid); border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .tabs .tab { flex: none; text-align: left; padding: 12px 14px; font-size: 15px; }
  .lf { display: inline; } .ls { display: none; }
  body { padding-bottom: 32px; }
  .filters { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
  .row { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .split { grid-template-columns: minmax(200px, 260px) 1fr; }
}
/* phone on its side: little height, so compact everything */
@media (orientation: landscape) and (max-height: 520px) {
  .wrap { grid-template-columns: 148px minmax(0, 1fr); column-gap: 14px; }
  body { padding-block: 10px 24px; }
  .logo { width: 36px; height: 36px; border-radius: 11px; font-size: 13px; }
  h1 { font-size: 18px; }
  .sub { font-size: 12px; }
  .tabs .tab { padding: 9px 10px; font-size: 14px; }
  .hero .value { font-size: 40px; }
  .card { padding: 14px; gap: 10px; }
  .pill { padding: 6px 12px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .filters > * { flex: none; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .tile .tv2 { font-size: 20px; }
}
/* big landscape screens: two cards per row */
@media (orientation: landscape) and (min-width: 1360px) {
  .wrap { max-width: 1720px; grid-template-columns: 210px minmax(0, 1fr); }
  section.page { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  section.page[hidden] { display: none; }
  section.page > .full { grid-column: 1 / -1; }
  section.page > .row { display: contents; }
  .tiles { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
}
/* office TV / large monitor */
@media (min-width: 1880px) and (orientation: landscape) {
  body { zoom: 1.18; }
  .wrap { max-width: 1760px; }
}

.plate { background: #fff; border-radius: 14px; padding: 6px 12px; display: flex; align-items: center; flex: none; box-shadow: 0 8px 22px -10px rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.65); }
.brandlogo { height: 40px; width: auto; display: block; }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--plane); opacity: 1; transition: opacity .6s ease; }
#splash.hide { opacity: 0; pointer-events: none; }
#splash[hidden] { display: none; }
.plate.big { padding: 20px 30px; border-radius: 26px; animation: splashIn .8s cubic-bezier(.2,.8,.2,1) both; }
.plate.big img { width: min(76vw, 460px); height: auto; display: block; }
@keyframes splashIn { from { opacity: 0; transform: translateY(10px) scale(.94); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .plate.big { animation: none; } #splash { transition: none; } }
@media (max-width: 560px) { .brandlogo { height: 32px; } .plate { padding: 5px 9px; border-radius: 12px; } }
@media (orientation: landscape) and (max-height: 520px) { .brandlogo { height: 30px; } .plate { padding: 4px 8px; } }

body.locked { overflow: hidden; }
#lock { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)); background: radial-gradient(900px 520px at 12% -8%, var(--glow1), transparent 62%), var(--plane); }
#lock[hidden] { display: none; }
.lock-card { width: min(100%, 400px); display: flex; flex-direction: column; gap: 16px; align-items: stretch; background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1px solid var(--ring); border-radius: 22px; padding: 26px 22px; box-shadow: 0 24px 60px -30px var(--shadow); }
.lock-card .plate { align-self: center; }
.lock-card .plate img { height: 64px; width: auto; display: block; }
.lock-card h1 { font-size: 20px; text-align: center; margin: 0; }
.lock-card p { margin: 0; color: var(--ink2); text-align: center; font-size: 14px; }
.pw-wrap { position: relative; display: flex; }
.lock-card #pw { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 12px 52px 12px 14px; border-radius: 12px; border: 1px solid var(--axis); background: var(--plane); color: var(--ink); }
.lock-card #pw:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--ink2); cursor: pointer; }
.pw-eye:hover { color: var(--ink); }
.pw-eye:focus-visible { outline: 2px solid var(--accent); }
.pw-eye .eye-off, .pw-eye[aria-pressed="true"] .eye-on { display: none; }
.pw-eye[aria-pressed="true"] .eye-off { display: block; }
.lock-card label { display: flex; gap: 8px; align-items: center; color: var(--ink2); font-size: 14px; }
.lock-card .btn { padding: 12px 16px; font-size: 16px; border-radius: 12px; }
.lock-msg { min-height: 20px; text-align: center; font-size: 14px; color: var(--ink2); }
.lock-msg.err { color: var(--crit); }
</style>
</head>

    var ctrMap = {};

      var o = ctrMap[c.n] || (ctrMap[c.n] = { n: c.n, k: c.k != null ? c.k : null, u: 0, z: 0, iu: 0, iz: 0, xu: 0, xz: 0 });
      if (c.cur === "UZS") o.z -= c.bal; else o.u -= usdOf(c.bal, c.cur);
    });

    var kset = {}; ["pl", "plRet", "plBrand"].forEach(function (k) { (raw[k] || []).forEach(function (r) { kset[kOf(r)] = 1; }); });
    var pkeys = Object.keys(kset).sort(), ki = {}; pkeys.forEach(function (k, i) { ki[k] = i; });
    var multiY = pkeys.some(function (k) { return k.slice(0, 4) !== pkeys[0].slice(0, 4); });
    var plLabels = pkeys.map(function (k) { return MONTHS[+k.slice(5) - 1] + (multiY ? " " + k.slice(0, 4) : ""); });
    var rows = [], idx = {};
    function row(name) { if (idx[name] == null) { idx[name] = rows.length; rows.push({ n: name, m: pkeys.map(function () { return 0; }) }); } return rows[idx[name]]; }
    var BRAND_ROW = { 1: "KAHWA", 2: "TORTO", 3: "TORTO фасовка", 0: "Без бренда" };
    ["KAHWA", "TORTO", "TORTO фасовка"].forEach(row);
    (raw.plBrand || []).forEach(function (b) { if (b.a) row(BRAND_ROW[b.p] || "Без бренда").m[ki[kOf(b)]] += b.a; });
    var FIXED = { 1: "Продажа товаров (Итог)", 2: "Выручка от продажи услуг", 3: "Выручка от продажи основных средств", 4: "Себестоимость продаж",
      5: "Себестоимость продажи основных средств", 8: "Выручка от продаж", 9: "Разница по возврату закупки" };
    var pl = raw.pl || [], ret = {};
    (raw.plRet || []).forEach(function (r) { ret[kOf(r)] = r.a || 0; });
    [1, 2, 3, 4, 5].forEach(function (no) { row(FIXED[no]); });
    row("Общая сумма продаж"); row("Общая себестоимость продаж"); row(FIXED[8]); row(FIXED[9]);
    var func9 = {};
    pl.forEach(function (r) {
      var mi = ki[kOf(r)];
      if (FIXED[r.no] && r.no !== 9) row(FIXED[r.no]).m[mi] = r.a;
      else if (r.no === 9) func9[kOf(r)] = r.a;
      else if (r.no === 6 || r.no === 7) row(/maya/i.test(r.n) ? "Общая себестоимость продаж" : "Общая сумма продаж").m[mi] = r.a;
      else if (r.no === 10) row(r.n).m[mi] += r.a;
    });
    pl.forEach(function (r) { if (r.no === 11) row(r.n).m[ki[kOf(r)]] += r.a; });
    row("Общий доход"); row("Общие затраты"); row("Чистая прибыль");
    pl.forEach(function (r) {
      var mi = ki[kOf(r)];
      if (r.no === 13) row("Общий доход").m[mi] = r.a;
      else if (r.no === 12) row("Общие затраты").m[mi] = r.a;
      else if (r.no === 14) {
        var fixedRet = ret[kOf(r)] || 0;
        row(FIXED[9]).m[mi] = fixedRet;
        row("Чистая прибыль").m[mi] = r.a + (func9[kOf(r)] || 0) - fixedRet;
      }
    });

    return {
      sales: (raw.sales || []).sort(byDateDesc),
      names: names,
      buy: (raw.buy || []).map(function (d) {
        return { d: d.d, no: d.no, s: d.s, cur: d.cur, o: d.o, v: d.v, imp: !!d.imp, it: (d.it || []).map(function (r) { return [r.n, r.q, r.u, r.v]; }) };
      }).sort(byDateDesc),
      production: { fileName: "Logix ERP", uploadedAt: t, docs: (raw.prod || []).sort(byDateDesc) },
      bank: { acc: (raw.bank || []).map(function (a) { a.nv = a.close * (rates[a.cur] || 1); return a; }), rates: rates },
      bankOps: (raw.bankOps || []).sort(byDateDesc),
      rates: rates,
      cash: (raw.cash || []).map(function (c) { c.usd = usdOf(c.close, c.cur); return c; }),
      cashOps: (raw.cashOps || []).sort(byDateDesc),
      ie: (raw.ie || []).sort(byDateDesc),
      dist: raw.dist || [],
      ctr: Object.keys(ctrMap).map(function (k) { return ctrMap[k]; }),
      pl: { months: plLabels, keys: pkeys, rows: rows },
      cur: null,
      stock: (raw.stock || []).map(function (s) { s.w = 0; return s; }),
      up: { db: { f: "Logix ERP", t: t } }, dataFrom: DATA_FROM,
      dbMode: true
    };
  }

  function startApp(state) {
    document.getElementById("state").textContent = JSON.stringify(state).replace(/</g, "\\u003c");
    var s = document.createElement("script");
    s.textContent = document.getElementById("appsrc").textContent;
    document.body.appendChild(s);
    lock.hidden = true;
    document.body.classList.remove("locked");
  }

  async function open(keyB64, pack) {
    var raw = await decrypt(pack, keyB64);
    lastT = pack.t || raw.t || 0;
    startApp(normalize(raw));
  }

  async function boot() {
    var pack;
    lock.hidden = false; btn.disabled = true; setMsg("Загрузка данных…");
    try { pack = await fetchPack(); }
    catch (e) {
      lock.hidden = false; btn.disabled = true;
      setMsg(/ 404$/.test(e && e.message || "")
        ? "Данные ещё не опубликованы: сервер пока не отправил первую выгрузку. Обновите страницу позже."
        : "Не удалось загрузить данные. Проверьте интернет и обновите страницу.", true);
      return;
    }
    btn.disabled = false; setMsg("");
    var saved = storeGet(localStorage) || storeGet(sessionStorage);
    if (saved && saved.salt === pack.salt) {
      try { await open(saved.key, pack); return; }
      catch (e) { storeSet(localStorage, null); storeSet(sessionStorage, null); }
    }
    lock.hidden = false;
    pw.focus();
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      if (!pw.value) return;
      btn.disabled = true; setMsg("Открываю…");
      try {
        var p = await fetchPack(), key = await deriveKey(pw.value, p), rec = { salt: p.salt, key: key };
        await open(key, p);
        storeSet(sessionStorage, rec);
        if (remember.checked) storeSet(localStorage, rec);
        pw.value = "";
      } catch (e) {
        setMsg(e && e.code === "pw" ? "Неверный пароль. Нажмите на глаз, чтобы увидеть, что введено; проверьте раскладку и Caps Lock." : "Не удалось открыть данные. Обновите страницу и попробуйте снова.", true);
        btn.disabled = false; pw.select();
      }
    });
  }

  // new data every 15 minutes: check every 5 and reload when it changed
  setInterval(async function () {
    if (!lastT || document.hidden) return;
    try { var p = await fetchPack(); if (p.t && p.t !== lastT) location.reload(); } catch (e) { /* offline: keep showing */ }
  }, 5 * 60 * 1000);
  document.addEventListener("visibilitychange", async function () {
    if (document.hidden || !lastT) return;
    try { var p = await fetchPack(); if (p.t && p.t !== lastT) location.reload(); } catch (e) { /* ignore */ }
  });
  window.ktLogout = function () { storeSet(localStorage, null); storeSet(sessionStorage, null); location.reload(); };

  if (!window.crypto || !crypto.subtle) { setMsg("Этот браузер не поддерживает шифрование. Откройте страницу в Chrome, Safari или Edge.", true); lock.hidden = false; return; }
  boot();
})();
</script>
